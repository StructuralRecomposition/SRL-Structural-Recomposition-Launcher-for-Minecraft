name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.2.3)"
        required: true
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify tag matches application versions
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test -n "$version"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$version"
          grep -q "^version = \"$version\"" Cargo.toml
      - run: node scripts/verify-no-secrets.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit
        run: npm audit --audit-level=high

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            frpc_targets: darwin-amd64,darwin-arm64
          - os: ubuntu-22.04
            name: linux-x64
            args: --bundles deb,appimage
            targets: ""
            frpc_targets: linux-amd64
          - os: windows-latest
            name: windows-x64
            args: --no-bundle
            targets: ""
            frpc_targets: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify no AI key in source
        run: node scripts/verify-no-secrets.mjs
      - run: npm ci
      - name: Fetch bundled FRPC
        shell: bash
        run: node scripts/fetch-frpc.mjs --targets=${{ matrix.frpc_targets }}
      - name: Build application
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Package Windows portable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ env.TAG }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target/release/sr-launcher.exe portable/
          Copy-Item packaging/windows/* portable/
          Copy-Item -Recurse src-tauri/resources/frpc portable/frpc
          Copy-Item THIRD_PARTY_NOTICES.md portable/
          Compress-Archive -Path portable/* -DestinationPath "SRL_${version}_windows-x64-portable.zip"
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            SRL_*_windows-x64-portable.zip
          if-no-files-found: error

  release:
    needs: [quality, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p release-assets
          cp "release/RELEASE_NOTES_${TAG}.md" release-notes.md
          cp "$(find artifacts -type f -name '*.dmg' | head -1)" "release-assets/SRL_${version}_universal.dmg"
          cp "$(find artifacts -type f -name '*.deb' | head -1)" "release-assets/SRL_${version}_amd64.deb"
          cp "$(find artifacts -type f -name '*.AppImage' | head -1)" "release-assets/SRL_${version}_amd64.AppImage"
          cp "$(find artifacts -type f -name 'SRL_*_windows-x64-portable.zip' | head -1)" "release-assets/SRL_${version}_windows-x64-portable.zip"
          git archive --format=tar.gz --prefix="SRL-${version}/" HEAD > "release-assets/SRL-${version}-source.tar.gz"
          cd release-assets
          # Hash every published asset, including the source archive
          # (`SRL-<version>-source.tar.gz`, which uses a hyphen).
          sha256sum SRL_* SRL-* > SHA256SUMS
          ls -lh
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: SRL ${{ env.TAG }} — Structural Recomposition Launcher for Minecraft
          body_path: release-notes.md
          files: release-assets/*
          make_latest: true
          draft: false
          prerelease: false
